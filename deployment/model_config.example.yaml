# OpenAI-compatible model settings.
# Client releases keep this file secret-free. Worker defaults are pulled from the central controller.
enabled: false
provider: openai_compatible
base_url: ""
api_key: ""
model: ""
timeout_seconds: 30
temperature: 0.1

smart_comment:
  enabled: false
  auto_publish: true
  save_drafts: true
  fallback_to_comment_library: true
  output_path: output/comment_drafts.jsonl
